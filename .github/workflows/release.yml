name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload release asset
        run: gh release upload "${{ github.event.release.tag_name }}" dist/compact-vehicle-card.js --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit built file to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/compact-vehicle-card.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: build ${{ github.event.release.tag_name }}"
            git push origin main
          fi
